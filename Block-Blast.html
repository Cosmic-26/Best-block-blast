<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2K Basketball Challenge 3D</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Montserrat:wght@700;900&display=swap');

    * {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Montserrat', sans-serif;
    }

    body {
      background-color: #030712;
      overflow: hidden;
      margin: 0;
    }

    /* 2K Shot Meter Styling */
    #shot-meter-container {
      position: absolute;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%);
      width: 240px;
      height: 28px;
      background: rgba(15, 23, 42, 0.85);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 14px;
      padding: 3px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8), inset 0 2px 4px rgba(0,0,0,0.8);
      display: none;
      z-index: 30;
    }

    #shot-meter-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3b82f6 0%, #eab308 70%, #22c55e 90%, #ef4444 100%);
      border-radius: 10px;
      transition: width 0.03s linear;
    }

    #green-zone {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 78%;
      width: 8%;
      background: rgba(34, 197, 94, 0.9);
      border-left: 2px solid #fff;
      border-right: 2px solid #fff;
      box-shadow: 0 0 15px #22c55e;
      z-index: 5;
    }

    #meter-marker {
      position: absolute;
      top: -4px;
      bottom: -4px;
      left: 0%;
      width: 6px;
      background: #ffffff;
      border-radius: 3px;
      box-shadow: 0 0 8px #fff;
      z-index: 10;
    }

    /* Green Light Splash Banner */
    .green-splash {
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.5);
      font-family: 'Teko', sans-serif;
      font-size: 80px;
      font-weight: 700;
      color: #22c55e;
      text-shadow: 0 0 20px #22c55e, 0 0 40px #15803d, 0 0 60px #000;
      pointer-events: none;
      opacity: 0;
      z-index: 40;
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.25s ease;
    }

    .green-splash.active {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.2);
    }

    /* Grade Notification Toast */
    #grade-toast {
      position: absolute;
      bottom: 160px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Teko', sans-serif;
      font-size: 32px;
      letter-spacing: 1.5px;
      font-weight: 700;
      text-transform: uppercase;
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 35;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9);
    }

    .glass-panel {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
  </style>
</head>
<body class="w-screen h-screen relative select-none">

  <!-- 3D Canvas Container -->
  <div id="canvas-container" class="w-full h-full absolute inset-0"></div>

  <!-- HUD Overlay Header -->
  <header class="absolute top-0 left-0 right-0 p-4 flex justify-between items-start pointer-events-none z-20">
    <!-- Score & Streak Box -->
    <div class="glass-panel p-3 rounded-2xl flex items-center gap-4 shadow-2xl">
      <div>
        <div class="text-[10px] text-slate-400 font-extrabold tracking-widest uppercase">SCORE</div>
        <div id="score-val" class="text-3xl font-black text-white font-mono leading-none">0</div>
      </div>
      <div class="h-8 w-px bg-slate-700"></div>
      <div>
        <div class="text-[10px] text-amber-400 font-extrabold tracking-widest uppercase">STREAK</div>
        <div id="streak-val" class="text-3xl font-black text-amber-400 font-mono leading-none">0</div>
      </div>
      <div class="h-8 w-px bg-slate-700"></div>
      <div>
        <div class="text-[10px] text-indigo-400 font-extrabold tracking-widest uppercase">BEST</div>
        <div id="best-val" class="text-3xl font-black text-indigo-300 font-mono leading-none">0</div>
      </div>
    </div>

    <!-- Timer / Mode Info -->
    <div class="glass-panel px-4 py-2.5 rounded-2xl text-center shadow-2xl">
      <div id="mode-label" class="text-[10px] text-slate-400 font-extrabold tracking-widest uppercase">FREE SHOOTAROUND</div>
      <div id="timer-val" class="text-3xl font-black text-white font-mono leading-none mt-0.5">--</div>
    </div>

    <!-- Camera / Sound Controls -->
    <div class="flex gap-2 pointer-events-auto">
      <button id="btn-cam" class="w-11 h-11 glass-panel rounded-2xl text-white flex items-center justify-center hover:bg-slate-700/80 active:scale-95 transition shadow-lg">
        <i class="fa-solid fa-video text-sm"></i>
      </button>
      <button id="btn-audio" class="w-11 h-11 glass-panel rounded-2xl text-white flex items-center justify-center hover:bg-slate-700/80 active:scale-95 transition shadow-lg">
        <i class="fa-solid fa-volume-high text-sm" id="audio-icon"></i>
      </button>
      <button id="btn-menu" class="w-11 h-11 glass-panel rounded-2xl text-white flex items-center justify-center hover:bg-slate-700/80 active:scale-95 transition shadow-lg">
        <i class="fa-solid fa-bars text-sm"></i>
      </button>
    </div>
  </header>

  <!-- Shot Grade Banner Toast -->
  <div id="grade-toast" class="text-white">SLIGHTLY LATE</div>

  <!-- Green Release Banner Overlay -->
  <div id="green-splash" class="green-splash">EXCELLENT RELEASE!</div>

  <!-- 2K Shot Meter -->
  <div id="shot-meter-container">
    <div id="green-zone"></div>
    <div id="shot-meter-bar"></div>
    <div id="meter-marker"></div>
  </div>

  <!-- Controls Footer / On-screen Shoot Button -->
  <footer class="absolute bottom-6 left-0 right-0 px-6 flex justify-between items-end z-20 pointer-events-none">
    <!-- Distance & Spot Info -->
    <div class="glass-panel px-4 py-2.5 rounded-2xl pointer-events-auto">
      <div class="text-[10px] text-slate-400 font-extrabold tracking-widest uppercase">SHOT DISTANCE</div>
      <div id="distance-val" class="text-xl font-black text-cyan-400 font-mono">24.2 FT</div>
    </div>

    <!-- Shoot Action Button (Mobile/Touch & Onscreen) -->
    <div class="flex flex-col items-center gap-1 pointer-events-auto">
      <button id="btn-shoot" class="w-24 h-24 rounded-full bg-gradient-to-tr from-indigo-600 via-purple-600 to-pink-500 border-4 border-white/30 text-white font-black text-lg shadow-2xl shadow-purple-500/50 active:scale-90 transition duration-75 flex flex-col items-center justify-center gap-0.5">
        <i class="fa-solid fa-basketball text-2xl"></i>
        <span class="text-[11px] tracking-wider uppercase font-extrabold">HOLD</span>
      </button>
      <span class="text-[10px] text-slate-400 font-bold tracking-wider uppercase bg-slate-900/80 px-2 py-0.5 rounded-full border border-slate-700/60">SPACEBAR / TAP</span>
    </div>

    <!-- Spot Navigation Selector -->
    <div class="glass-panel p-2 rounded-2xl flex gap-1.5 pointer-events-auto">
      <button id="spot-left" class="w-10 h-10 rounded-xl bg-slate-800 text-slate-300 hover:bg-slate-700 flex items-center justify-center transition">
        <i class="fa-solid fa-chevron-left"></i>
      </button>
      <button id="spot-random" class="px-3 h-10 rounded-xl bg-indigo-600 text-white font-extrabold text-xs uppercase tracking-wider hover:bg-indigo-500 transition">
        MOVE SPOT
      </button>
      <button id="spot-right" class="w-10 h-10 rounded-xl bg-slate-800 text-slate-300 hover:bg-slate-700 flex items-center justify-center transition">
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    </div>
  </footer>

  <!-- Main Game Selection Menu Modal -->
  <div id="menu-modal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-xl z-50 flex items-center justify-center p-4">
    <div class="glass-panel p-8 rounded-3xl w-full max-w-md text-center border border-slate-700/80 shadow-2xl space-y-6">
      <div>
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-amber-500 to-red-600 text-white text-3xl shadow-lg shadow-red-500/30 mb-3">
          <i class="fa-solid fa-basketball"></i>
        </div>
        <h1 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-orange-400 to-red-500 tracking-wider">
          2K HOOPS 3D
        </h1>
        <p class="text-xs text-slate-400 font-semibold mt-1">PRO ARCADE BASKETBALL SIMULATOR</p>
      </div>

      <!-- Mode Selector Buttons -->
      <div class="space-y-3 text-left">
        <button id="mode-shootaround" class="w-full p-4 rounded-2xl bg-gradient-to-r from-slate-800 to-slate-900 border border-slate-700 hover:border-indigo-500 text-white transition flex items-center justify-between group">
          <div>
            <div class="font-extrabold text-sm text-indigo-300 group-hover:text-indigo-200">FREE SHOOTAROUND</div>
            <div class="text-[11px] text-slate-400">Practice shot timing from various spots</div>
          </div>
          <i class="fa-solid fa-play text-slate-500 group-hover:text-indigo-400 transition"></i>
        </button>

        <button id="mode-3point" class="w-full p-4 rounded-2xl bg-gradient-to-r from-slate-800 to-slate-900 border border-slate-700 hover:border-amber-500 text-white transition flex items-center justify-between group">
          <div>
            <div class="font-extrabold text-sm text-amber-400 group-hover:text-amber-300">3-POINT CONTEST</div>
            <div class="text-[11px] text-slate-400">60s timed session with Money Balls (2 pts)</div>
          </div>
          <i class="fa-solid fa-fire text-slate-500 group-hover:text-amber-400 transition"></i>
        </button>

        <button id="mode-dunk" class="w-full p-4 rounded-2xl bg-gradient-to-r from-slate-800 to-slate-900 border border-slate-700 hover:border-emerald-500 text-white transition flex items-center justify-between group">
          <div>
            <div class="font-extrabold text-sm text-emerald-400 group-hover:text-emerald-300">DRIVE & DUNK MODE</div>
            <div class="text-[11px] text-slate-400">Drive to the basket for dunks & layups</div>
          </div>
          <i class="fa-solid fa-bolt text-slate-500 group-hover:text-emerald-400 transition"></i>
        </button>
      </div>

      <button id="btn-start-game" class="w-full py-4 rounded-2xl bg-gradient-to-r from-amber-500 via-orange-500 to-red-600 text-white font-black text-lg tracking-wider shadow-lg shadow-orange-500/40 hover:opacity-95 active:scale-95 transition">
        ENTER COURT
      </button>
    </div>
  </div>

  <script>
    /* ==========================================
       1. WEB AUDIO SYNTHESIZER SYSTEM
       ========================================== */
    class AudioEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playBounce() {
        if (this.muted) return;
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(140, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.12);
      }

      playSwish() {
        if (this.muted) return;
        this.init();
        // White noise swish net simulation
        const bufferSize = this.ctx.sampleRate * 0.25;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const output = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = Math.random() * 2 - 1;
        }

        const whiteNoise = this.ctx.createBufferSource();
        whiteNoise.buffer = buffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1200, this.ctx.currentTime);
        filter.Q.setValueAtTime(3.0, this.ctx.currentTime);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.35, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);

        whiteNoise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        whiteNoise.start();
      }

      playRimClank() {
        if (this.muted) return;
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(850, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(300, this.ctx.currentTime + 0.18);
        gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.18);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.18);
      }

      playGreenCheer() {
        if (this.muted) return;
        this.init();
        // High note fanfare chime
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.05);
          gain.gain.setValueAtTime(0.2, this.ctx.currentTime + idx * 0.05);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + idx * 0.05 + 0.25);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(this.ctx.currentTime + idx * 0.05);
          osc.stop(this.ctx.currentTime + idx * 0.05 + 0.25);
        });
      }
    }

    const audioEngine = new AudioEngine();

    /* ==========================================
       2. THREE.JS 3D ARENA & GRAPHICS SYSTEM
       ========================================== */
    let scene, camera, renderer;
    let ball, rim, backboard, net;
    let ballPhysics = {
      active: false,
      pos: new THREE.Vector3(),
      vel: new THREE.Vector3(),
      rot: new THREE.Vector3(),
      radius: 0.38
    };

    const HOOP_POS = new THREE.Vector3(0, 5.2, -18); // Rim center position
    const HOOP_RADIUS = 0.75;

    // Shooting Spots Preset Positions
    const SPOTS = [
      { name: 'Left Corner 3', pos: new THREE.Vector3(-14, 0, -16) },
      { name: 'Left Wing 3', pos: new THREE.Vector3(-11, 0, -8) },
      { name: 'Top of Key 3', pos: new THREE.Vector3(0, 0, -4) },
      { name: 'Right Wing 3', pos: new THREE.Vector3(11, 0, -8) },
      { name: 'Right Corner 3', pos: new THREE.Vector3(14, 0, -16) },
      { name: 'Free Throw', pos: new THREE.Vector3(0, 0, -10) }
    ];

    let currentSpotIdx = 2; // Top of key default
    let playerPos = SPOTS[currentSpotIdx].pos.clone();

    // Camera Angles
    const CAM_VIEWS = ['broadcast', 'player', 'baseline'];
    let currentCamIdx = 0;

    function init3D() {
      const container = document.getElementById('canvas-container');
      
      // Scene
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a0f1d);
      scene.fog = new THREE.FogExp2(0x0a0f1d, 0.015);

      // Camera
      camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
      
      // Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      // Lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
      scene.add(ambientLight);

      const mainLight = new THREE.DirectionalLight(0xfff5ea, 1.2);
      mainLight.position.set(10, 25, 5);
      mainLight.castShadow = true;
      mainLight.shadow.mapSize.width = 2048;
      mainLight.shadow.mapSize.height = 2048;
      mainLight.shadow.camera.near = 0.5;
      mainLight.shadow.camera.far = 50;
      mainLight.shadow.camera.left = -20;
      mainLight.shadow.camera.right = 20;
      mainLight.shadow.camera.top = 20;
      mainLight.shadow.camera.bottom = -20;
      scene.add(mainLight);

      // Arena Arena Stadium Lights (Spotlights)
      const spot1 = new THREE.SpotLight(0x38bdf8, 2, 60, Math.PI / 4);
      spot1.position.set(-18, 20, -10);
      scene.add(spot1);

      const spot2 = new THREE.SpotLight(0xf43f5e, 2, 60, Math.PI / 4);
      spot2.position.set(18, 20, -10);
      scene.add(spot2);

      // Construct Environment
      createHardwoodCourt();
      createBasketballHoop();
      createBasketball();

      updateCameraPosition();

      window.addEventListener('resize', onWindowResize);
    }

    function createHardwoodCourt() {
      // Floor Mesh
      const floorGeo = new THREE.PlaneGeometry(50, 40);
      
      // Procedural Wood Texture Canvas
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#d97706';
      ctx.fillRect(0, 0, 1024, 1024);

      // Draw Wood Planks
      ctx.fillStyle = '#b45309';
      for (let i = 0; i < 1024; i += 32) {
        ctx.fillRect(0, i, 1024, 2);
      }

      // Court Lines (White & Key Fill)
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 12;

      // Outer Boundary
      ctx.strokeRect(50, 50, 924, 924);

      // Paint Key Rect
      ctx.fillStyle = 'rgba(185, 28, 28, 0.85)';
      ctx.fillRect(362, 524, 300, 450);
      ctx.strokeRect(362, 524, 300, 450);

      // 3-Point Arc
      ctx.beginPath();
      ctx.arc(512, 974, 380, Math.PI, 0, false);
      ctx.stroke();

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;

      const floorMat = new THREE.MeshStandardMaterial({
        map: texture,
        roughness: 0.25,
        metalness: 0.1
      });

      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.position.set(0, 0, -10);
      floor.receiveShadow = true;
      scene.add(floor);
    }

    function createBasketballHoop() {
      // Backboard Glass
      const glassGeo = new THREE.BoxGeometry(6, 4, 0.15);
      const glassMat = new THREE.MeshPhysicalMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.7,
        roughness: 0.1,
        transmission: 0.9,
        thickness: 0.5
      });
      backboard = new THREE.Mesh(glassGeo, glassMat);
      backboard.position.set(0, 6.8, -19.2);
      backboard.castShadow = true;
      scene.add(backboard);

      // Backboard White Inner Border
      const frameGeo = new THREE.BoxGeometry(2.2, 1.6, 0.18);
      const frameMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true });
      const frame = new THREE.Mesh(frameGeo, frameMat);
      frame.position.set(0, 6.0, -19.1);
      scene.add(frame);

      // Metallic Orange Rim
      const rimGeo = new THREE.TorusGeometry(HOOP_RADIUS, 0.06, 16, 32);
      const rimMat = new THREE.MeshStandardMaterial({
        color: 0xea580c,
        metalness: 0.8,
        roughness: 0.2
      });
      rim = new THREE.Mesh(rimGeo, rimMat);
      rim.rotation.x = Math.PI / 2;
      rim.position.copy(HOOP_POS);
      rim.castShadow = true;
      scene.add(rim);

      // Support Structure Pole
      const poleGeo = new THREE.CylinderGeometry(0.25, 0.25, 8, 16);
      const poleMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.7 });
      const pole = new THREE.Mesh(poleGeo, poleMat);
      pole.position.set(0, 4, -20);
      scene.add(pole);

      // Mesh Net (Cylinder cone approximation)
      const netGeo = new THREE.CylinderGeometry(HOOP_RADIUS, 0.45, 1.2, 16, 8, true);
      const netMat = new THREE.MeshBasicMaterial({
        color: 0xffffff,
        wireframe: true,
        transparent: true,
        opacity: 0.7
      });
      net = new THREE.Mesh(netGeo, netMat);
      net.position.set(0, HOOP_POS.y - 0.6, HOOP_POS.z);
      scene.add(net);
    }

    function createBasketball() {
      const ballGeo = new THREE.SphereGeometry(ballPhysics.radius, 32, 32);
      
      // Procedural Leather Texture with Seams
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ea580c';
      ctx.fillRect(0, 0, 512, 256);

      // Black Seam Lines
      ctx.strokeStyle = '#111827';
      ctx.lineWidth = 6;
      ctx.strokeRect(0, 0, 512, 256);

      ctx.beginPath();
      ctx.arc(256, 128, 100, 0, Math.PI * 2);
      ctx.stroke();

      const texture = new THREE.CanvasTexture(canvas);
      const ballMat = new THREE.MeshStandardMaterial({
        map: texture,
        roughness: 0.4,
        metalness: 0.1
      });

      ball = new THREE.Mesh(ballGeo, ballMat);
      ball.castShadow = true;
      scene.add(ball);

      resetBallToPlayer();
    }

    function resetBallToPlayer() {
      ballPhysics.active = false;
      ballPhysics.pos.copy(playerPos).add(new THREE.Vector3(0, 2.5, 0));
      ballPhysics.vel.set(0, 0, 0);
      ballPhysics.rot.set(0, 0, 0);

      ball.position.copy(ballPhysics.pos);
      updateDistanceUI();
    }

    /* ==========================================
       3. 2K SHOT METER & PHYSICS CALCULATIONS
       ========================================== */
    let isHoldingShot = false;
    let shotMeterValue = 0; // 0 to 100
    let meterDirection = 1;
    let currentMode = 'shootaround'; // 'shootaround', '3point', 'dunk'
    let score = 0;
    let streak = 0;
    let highScore = localStorage.getItem('2k_hoops_best') || 0;
    let gameTimer = 60;
    let timerInterval = null;

    // Shot Meter UI Elements
    const shotMeterContainer = document.getElementById('shot-meter-container');
    const shotMeterBar = document.getElementById('shot-meter-bar');
    const meterMarker = document.getElementById('meter-marker');
    const gradeToast = document.getElementById('grade-toast');
    const greenSplash = document.getElementById('green-splash');

    function updateDistanceUI() {
      const dist = playerPos.distanceTo(HOOP_POS) * 1.2; // Convert to feet equivalent
      document.getElementById('distance-val').innerText = `${dist.toFixed(1)} FT`;
    }

    function startShot() {
      if (ballPhysics.active) return;
      audioEngine.init();

      isHoldingShot = true;
      shotMeterValue = 0;
      meterDirection = 1;
      shotMeterContainer.style.display = 'block';
    }

    function releaseShot() {
      if (!isHoldingShot) return;
      isHoldingShot = false;
      shotMeterContainer.style.display = 'none';

      // Evaluate Shot Release Timing
      // Green Release Zone is between 80% and 88%
      const value = shotMeterValue;
      let grade = '';
      let quality = 0; // 0: Miss, 1: Make, 2: Perfect Green

      if (value >= 80 && value <= 88) {
        grade = 'PERFECT RELEASE!';
        quality = 2; // Green
      } else if (value >= 72 && value < 80) {
        grade = 'SLIGHTLY EARLY';
        quality = 1;
      } else if (value > 88 && value <= 95) {
        grade = 'SLIGHTLY LATE';
        quality = 1;
      } else if (value < 72) {
        grade = 'VERY EARLY - AIRBALL';
        quality = 0;
      } else {
        grade = 'VERY LATE - OFF RIM';
        quality = 0;
      }

      showGradeToast(grade, quality);
      executeBallPhysicsLaunch(quality);
    }

    function showGradeToast(grade, quality) {
      gradeToast.innerText = grade;
      gradeToast.style.opacity = '1';
      
      if (quality === 2) {
        gradeToast.className = 'text-green-400 font-extrabold';
        greenSplash.classList.add('active');
        audioEngine.playGreenCheer();
        setTimeout(() => greenSplash.classList.remove('active'), 1200);
      } else if (quality === 1) {
        gradeToast.className = 'text-amber-300 font-extrabold';
      } else {
        gradeToast.className = 'text-red-400 font-extrabold';
      }

      setTimeout(() => {
        gradeToast.style.opacity = '0';
      }, 1500);
    }

    function executeBallPhysicsLaunch(quality) {
      ballPhysics.active = true;

      // Calculate trajectory vector to hoop
      const start = ballPhysics.pos.clone();
      const target = HOOP_POS.clone();

      if (quality === 2) {
        // Perfect Swish Arc
        target.y += 0.2; 
      } else if (quality === 1) {
        // Hit rim slightly or drop in
        target.x += (Math.random() - 0.5) * 0.4;
        target.z += (Math.random() - 0.5) * 0.4;
      } else {
        // Off target miss
        target.x += (Math.random() - 0.5) * 2.0;
        target.z += (Math.random() - 0.5) * 1.5;
      }

      const dist = start.distanceTo(target);
      const timeToTarget = 0.9 + dist * 0.02; // seconds

      // Calculate initial velocity required under gravity (g = -18)
      const g = 18;
      const vx = (target.x - start.x) / timeToTarget;
      const vz = (target.z - start.z) / timeToTarget;
      const vy = (target.y - start.y) / timeToTarget + 0.5 * g * timeToTarget;

      ballPhysics.vel.set(vx, vy, vz);
      ballPhysics.rot.set(Math.random() * 5, Math.random() * 2, 0);

      ballPhysics.quality = quality;
      ballPhysics.hasScored = false;
    }

    /* ==========================================
       4. ANIMATION LOOP & PHYSICS UPDATES
       ========================================== */
    const dt = 1 / 60;
    const gravity = -18;

    function animate() {
      requestAnimationFrame(animate);

      // Handle Shot Meter Hold Fill
      if (isHoldingShot) {
        shotMeterValue += meterDirection * 2.2;
        if (shotMeterValue >= 100) {
          shotMeterValue = 100;
          releaseShot(); // Auto release on max limit
        }
        meterMarker.style.left = `${shotMeterValue}%`;
        shotMeterBar.style.width = `${shotMeterValue}%`;
      }

      // Handle Active Ball Flight Physics
      if (ballPhysics.active) {
        ballPhysics.vel.y += gravity * dt;
        ballPhysics.pos.addScaledVector(ballPhysics.vel, dt);

        ball.position.copy(ballPhysics.pos);
        ball.rotation.x += ballPhysics.rot.x * dt;
        ball.rotation.y += ballPhysics.rot.y * dt;

        // Collision Check: Floor Bounce
        if (ballPhysics.pos.y <= ballPhysics.radius) {
          ballPhysics.pos.y = ballPhysics.radius;
          ballPhysics.vel.y *= -0.65; // Bounce elasticity
          ballPhysics.vel.x *= 0.8;
          ballPhysics.vel.z *= 0.8;

          if (Math.abs(ballPhysics.vel.y) > 1.0) {
            audioEngine.playBounce();
          } else {
            // Ball came to rest
            setTimeout(resetBallToPlayer, 600);
          }
        }

        // Collision Check: Rim & Swish Scoring Area
        const distToHoop = ballPhysics.pos.distanceTo(HOOP_POS);
        if (distToHoop < HOOP_RADIUS + 0.2 && !ballPhysics.hasScored) {
          if (ballPhysics.quality >= 1) {
            // Swish / Made Shot
            ballPhysics.hasScored = true;
            audioEngine.playSwish();
            registerScore(ballPhysics.quality === 2 ? 3 : 2);
          } else {
            // Rim Clank Miss
            ballPhysics.vel.x *= -0.5;
            ballPhysics.vel.z *= -0.5;
            ballPhysics.vel.y *= 0.5;
            audioEngine.playRimClank();
            resetStreak();
          }
        }

        // Collision Check: Backboard Bounce
        if (Math.abs(ballPhysics.pos.z - (-19.1)) < 0.3 && Math.abs(ballPhysics.pos.x) < 3 && ballPhysics.pos.y > 5) {
          ballPhysics.vel.z *= -0.6;
          audioEngine.playRimClank();
        }
      }

      renderer.render(scene, camera);
    }

    function registerScore(pts) {
      score += pts;
      streak++;
      document.getElementById('score-val').innerText = score;
      document.getElementById('streak-val').innerText = streak;

      if (score > highScore) {
        highScore = score;
        document.getElementById('best-val').innerText = highScore;
        localStorage.setItem('2k_hoops_best', highScore);
      }

      setTimeout(resetBallToPlayer, 1200);
    }

    function resetStreak() {
      streak = 0;
      document.getElementById('streak-val').innerText = '0';
    }

    /* ==========================================
       5. CAMERA & SPOT MANAGEMENT
       ========================================== */
    function updateCameraPosition() {
      const mode = CAM_VIEWS[currentCamIdx];

      if (mode === 'broadcast') {
        camera.position.set(0, 10, 12);
        camera.lookAt(0, 4, -10);
      } else if (mode === 'player') {
        camera.position.copy(playerPos).add(new THREE.Vector3(0, 3.5, 4.5));
        camera.lookAt(0, 5, -18);
      } else if (mode === 'baseline') {
        camera.position.set(0, 7, -22);
        camera.lookAt(0, 3, -5);
      }
    }

    function changeSpot(direction) {
      if (ballPhysics.active) return;
      currentSpotIdx = (currentSpotIdx + direction + SPOTS.length) % SPOTS.length;
      playerPos.copy(SPOTS[currentSpotIdx].pos);
      resetBallToPlayer();
      if (CAM_VIEWS[currentCamIdx] === 'player') updateCameraPosition();
    }

    /* ==========================================
       6. GAME MODES & CONTROLS
       ========================================== */
    function setGameMode(mode) {
      currentMode = mode;
      score = 0;
      streak = 0;
      document.getElementById('score-val').innerText = '0';
      document.getElementById('streak-val').innerText = '0';

      if (timerInterval) clearInterval(timerInterval);

      if (mode === '3point') {
        document.getElementById('mode-label').innerText = '3-POINT CONTEST';
        gameTimer = 60;
        document.getElementById('timer-val').innerText = gameTimer;

        timerInterval = setInterval(() => {
          gameTimer--;
          document.getElementById('timer-val').innerText = gameTimer;
          if (gameTimer <= 0) {
            clearInterval(timerInterval);
            alert(`Time's up! Final Score: ${score}`);
            document.getElementById('menu-modal').classList.remove('hidden');
          }
        }, 1000);
      } else {
        document.getElementById('mode-label').innerText = 'FREE SHOOTAROUND';
        document.getElementById('timer-val').innerText = '--';
      }

      document.getElementById('menu-modal').classList.add('hidden');
      resetBallToPlayer();
    }

    // Keyboard & Pointer Events
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && !e.repeat) {
        startShot();
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'Space') {
        releaseShot();
      }
    });

    const shootBtn = document.getElementById('btn-shoot');
    shootBtn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      startShot();
    });
    shootBtn.addEventListener('pointerup', (e) => {
      e.preventDefault();
      releaseShot();
    });

    document.getElementById('spot-left').addEventListener('click', () => changeSpot(-1));
    document.getElementById('spot-right').addEventListener('click', () => changeSpot(1));
    document.getElementById('spot-random').addEventListener('click', () => changeSpot(Math.floor(Math.random() * SPOTS.length)));

    document.getElementById('btn-cam').addEventListener('click', () => {
      currentCamIdx = (currentCamIdx + 1) % CAM_VIEWS.length;
      updateCameraPosition();
    });

    const audioBtn = document.getElementById('btn-audio');
    const audioIcon = document.getElementById('audio-icon');
    audioBtn.addEventListener('click', () => {
      audioEngine.muted = !audioEngine.muted;
      audioIcon.className = audioEngine.muted ? 'fa-solid fa-volume-xmark text-sm' : 'fa-solid fa-volume-high text-sm';
    });

    document.getElementById('btn-menu').addEventListener('click', () => {
      document.getElementById('menu-modal').classList.remove('hidden');
    });

    document.getElementById('btn-start-game').addEventListener('click', () => {
      setGameMode(currentMode);
    });

    document.getElementById('mode-shootaround').addEventListener('click', () => setGameMode('shootaround'));
    document.getElementById('mode-3point').addEventListener('click', () => setGameMode('3point'));
    document.getElementById('mode-dunk').addEventListener('click', () => {
      playerPos.set(0, 0, -10); // Move close to rim
      setGameMode('dunk');
    });

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // Start 3D Engine & Animation
    init3D();
    animate();
  </script>
</body>
</html>
